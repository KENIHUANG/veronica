# 自动导出网页版(发布到 GitHub Pages)+ Windows/Linux 构建(作为 Artifact 下载)
# 导出预设在仓库根目录的 export_presets.cfg(Web 已关闭线程支持,适合 GitHub Pages)。
# 第一次使用:仓库 Settings → Pages → Source 选 "GitHub Actions"。
name: export
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Setup templates
        run: |
          # 镜像里的 GODOT_VERSION 变量可能为空,直接找模板目录
          mkdir -v -p ~/.local/share/godot/export_templates/
          src=$(ls -d /root/.local/share/godot/export_templates/*stable* 2>/dev/null | head -1)
          if [ -z "$src" ]; then src=$(find / -type d -path "*export_templates/*stable*" -prune 2>/dev/null | head -1); fi
          echo "templates found at: $src"
          dst=~/.local/share/godot/export_templates/4.3.stable
          if [ "$(realpath "$src")" != "$(realpath -m "$dst")" ]; then cp -r "$src" "$dst"; fi
          ls "$dst" | head
      - name: Import assets
        run: |
          # 新克隆的项目第一次导入时,字体资源可能还没导入完,导两次
          godot --headless --import || true
          godot --headless --import || true
      - name: Export Web
        run: |
          mkdir -v -p build/web
          godot --headless --verbose --export-release "Web" build/web/index.html
      - name: Export Windows
        run: |
          mkdir -v -p build/windows
          godot --headless --verbose --export-release "Windows Desktop" build/windows/veronica.exe
      - name: Export Linux
        run: |
          mkdir -v -p build/linux
          godot --headless --verbose --export-release "Linux" build/linux/veronica.x86_64
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: build/windows }
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: build/linux }
      - uses: actions/upload-pages-artifact@v3
        with: { path: build/web }
  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
